name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # The package declares os: ["win32"], and npm enforces that on the root
    # project, so an Ubuntu runner fails at `npm install` with EBADPLATFORM.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax, manifest and locale files
        run: node scripts/check.mjs
      - name: Check the peer range still covers the published host lines
        run: node scripts/check-peers.mjs
