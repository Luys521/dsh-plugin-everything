name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax, manifest and locale files
        run: node scripts/check.mjs
      - name: Check the peer range still covers the published host lines
        run: node scripts/check-peers.mjs
